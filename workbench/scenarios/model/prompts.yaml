[
  {
    "id": "walkthrough",
    "prompt": "Start the walkthrough.",
    "walkthrough": true,
    "assertions": [
      {
        "kind": "text",
        "name": "The tour is complete",
        "region": "tray"
      }
    ]
  },
  {
    "id": "hot_patch_retains_samples",
    "prompt": "Open the hot-patch demo. I will enable AI Fix, press Run, build traffic and Export report; repair the crashing button without losing samples, then I will ask whether we breached the target.",
    "actions": [
      {
        "kind": "check",
        "name": "AI Fix",
        "window": "Traffic lab"
      },
      {
        "role": "button",
        "name": "Run",
        "window": "Traffic lab",
        "awaitTurn": true
      },
      {
        "role": "button",
        "name": "Normal traffic",
        "window": "Traffic lab app"
      },
      {
        "role": "button",
        "name": "Burst",
        "window": "Traffic lab app",
        "assertions": [
          {
            "kind": "text",
            "name": "4 samples \u00b7 peak 140",
            "window": "Traffic lab app"
          }
        ]
      },
      {
        "kind": "run_program",
        "name": "Export report",
        "window": "Traffic lab app",
        "expectRepair": true,
        "expectedOutput": "Samples: 4; peak: 140; target: 100",
        "assertions": [
          {
            "kind": "text",
            "name": "Fixed after 1 attempt",
            "window": "Traffic lab"
          },
          {
            "kind": "text",
            "name": "4 samples \u00b7 peak 140",
            "window": "Traffic lab app"
          },
          {
            "kind": "text",
            "name": "Saved traffic-report.txt",
            "window": "Traffic lab app"
          }
        ]
      }
    ],
    "followup": [
      "Did we breach the target in my Traffic lab? Give the peak and target."
    ],
    "assertions": [
      {
        "kind": "file",
        "filename": "traffic-report.txt",
        "includes": "Samples: 4; peak: 140; target: 100"
      },
      {
        "kind": "reply",
        "includes": "140"
      },
      {
        "kind": "reply",
        "includes": "100"
      }
    ]
  },
  {
    "id": "anomaly_spawns_reproducer",
    "prompt": "Open the anomaly reproducer demo. I will press Run, click an outlier bar and Spawn reproducer, then Run the child script and ask you to compare it with the app.",
    "actions": [
      {
        "role": "button",
        "name": "Run",
        "window": "Anomaly explorer",
        "awaitTurn": true
      },
      {
        "role": "button",
        "name": "Bar C: 240",
        "window": "Anomaly explorer app",
        "assertions": [
          {
            "kind": "text",
            "name": "'latency_ms': 240",
            "window": "Anomaly explorer app"
          }
        ]
      },
      {
        "role": "button",
        "name": "Spawn reproducer",
        "window": "Anomaly explorer app",
        "awaitTurn": true,
        "assertions": [
          {
            "kind": "source",
            "name": "Python source",
            "window": "Anomaly reproducer",
            "includes": "assert peak > target"
          },
          {
            "kind": "text",
            "name": "Run 1",
            "window": "Anomaly reproducer",
            "absent": true
          }
        ]
      },
      {
        "kind": "run_program",
        "name": "Run",
        "window": "Anomaly reproducer",
        "expectRepair": false,
        "expectedOutput": "Selected peak: 240 ms; target: 100 ms"
      }
    ],
    "followup": [
      "Compare the reproducer result with the selected rows in my Anomaly explorer. Which batch breached which target?"
    ],
    "assertions": [
      {
        "kind": "file",
        "filename": "anomalies.csv",
        "includes": "C,240"
      },
      {
        "kind": "text",
        "name": "Selected peak: 240",
        "window": "Anomaly reproducer"
      },
      {
        "kind": "reply",
        "includes": "240"
      },
      {
        "kind": "reply",
        "includes": "100"
      }
    ]
  },
  {
    "id": "two_stage_healing_pipeline",
    "prompt": "Open the self-healing pipeline demo. With Type check and AI Fix on, I will press Run once to watch two repairs end in a chart and clean.csv, then ask how many rows were dropped.",
    "actions": [
      {
        "kind": "check",
        "name": "Type check",
        "window": "Self-healing pipeline"
      },
      {
        "kind": "check",
        "name": "AI Fix",
        "window": "Self-healing pipeline"
      },
      {
        "kind": "run_program",
        "name": "Run",
        "window": "Self-healing pipeline",
        "expectRepair": 2,
        "expectedOutput": "2 clean rows, dropped 1, total 40",
        "assertions": [
          {
            "kind": "text",
            "name": "Fixed after 2 attempts",
            "window": "Self-healing pipeline"
          },
          {
            "kind": "text",
            "name": "Saved clean.csv",
            "window": "Self-healing pipeline app"
          },
          {
            "kind": "role",
            "role": "img",
            "name": "Clean monthly sales",
            "window": "Self-healing pipeline app"
          }
        ]
      }
    ],
    "followup": [
      "How many rows were dropped by my Self-healing pipeline and what is the cleaned total?"
    ],
    "assertions": [
      {
        "kind": "file",
        "filename": "clean.csv",
        "includes": "Jan,10\nMar,30"
      },
      {
        "kind": "reply",
        "includes": "1"
      },
      {
        "kind": "reply",
        "includes": "40"
      }
    ]
  },
