  {
    "id": "repl_result",
    "prompt": "Create a Python program in a window titled Scenario compute. Its source must be exactly print(pow(7, 12345, 1000003)). Do not work out the result yourself. I will press Run and then ask you what it printed.",
    "actions": [
      {
        "role": "button",
        "name": "Run",
        "region": "canvas",
        "awaitTurn": true
      }
    ],
    "followup": [
      "What number did the program print? Reply with the number only."
    ],
    "assertions": [
      {
        "kind": "text",
        "name": "Scenario compute",
        "region": "canvas"
      },
      {
        "kind": "reply",
        "includes": {
          "pow": [
            7,
            12345,
            1000003
          ]
        }
      }
    ]
  },
