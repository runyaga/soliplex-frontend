name: soliplex_monty_app
description: >-
  The standard Soliplex web client with the soliplex_monty lab catalog
  registered. Built for local stacks such as soliplex-dojo.
publish_to: none
version: 0.119.0+108

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  a2ui_flutter: ^0.4.0
  flutter:
    sdk: flutter
  soliplex_catalogs:
    path: ../../soliplex_catalogs
  soliplex_frontend:
    path: ../../..
  soliplex_monty:
    path: ..

dev_dependencies:
  a2ui_agent: 0.4.0
  dart_monty:
    path: ../../../../../dart_monty2/packages/dart_monty
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.2
  soliplex_agent:
    path: ../../soliplex_agent
  soliplex_client:
    path: ../../soliplex_client
  soliplex_design:
    path: ../../soliplex_design
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

# dart_monty pins hooks ^1.0.2 and code_assets ^1.0.0. soliplex_frontend reaches
# hooks ^2 through better_player_macos -> objective_c. The web build runs no
# code-asset hook, so the override only has to compile dart_monty's hook.
dependency_overrides:
  # soliplex_monty asks for dart_monty: any; this app pins the local checkout.
  dart_monty:
    path: ../../../../../dart_monty2/packages/dart_monty
  code_assets: ^2.2.0
  hooks: ^2.2.0
