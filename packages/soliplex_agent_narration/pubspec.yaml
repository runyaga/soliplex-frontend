name: soliplex_agent_narration
description: Narration log surface for soliplex_agent — an app-singleton controller, ClientTool surface, and MontyExtension bridge for emitting narrated events from agents and Python externals.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  dart_monty:
    path: ../../../dart_monty
  flutter:
    sdk: flutter
  meta: ^1.16.0
  signals_core: ^6.2.0
  signals_flutter: ^6.3.0
  soliplex_agent:
    path: ../soliplex_agent
  soliplex_client:
    path: ../soliplex_client

dev_dependencies:
  flutter_test:
    sdk: flutter
